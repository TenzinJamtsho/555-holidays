<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal: Stories &amp; Guides from Bhutan | 555 Holidays</title>
<meta name="description" content="Stories, seasonal guides and practical advice from our team in Thimphu: festivals, Gross National Happiness, flying into Paro, sustainable travel and more.">
<link rel="canonical" href="https://bhutantourinfo.com/blog.html">
<meta property="og:title" content="Journal | 555 Holidays">
<meta property="og:image" content="https://bhutantourinfo.com/images/gal-2.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="blog">
<a class="skip" href="#main">Skip to content</a>
<div class="page">
<header class="phero">
  <img src="images/gal-2.jpg" alt="Tall white prayer flags in a valley">
  <div data-nav></div>
  <div class="copy">
    <div class="crumb"><a href="index.html">Home</a><span>/</span><span>Journal</span></div>
    <h1>Letters from Bhutan</h1>
    <p>Stories, seasons and practical notes from our team in Thimphu.</p>
  </div>
</header>

<main id="main">
<section style="padding-top:clamp(50px,5vw,80px)">
  <div class="wrap">
    <div id="featured"></div>
    <div class="filters rv" id="cats" role="group" aria-label="Filter by topic"></div>
    <div class="posts" id="posts"></div>
  </div>
</section>
</main>
<footer data-footer></footer>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const { S, R, esc, img, reveal } = window.UI;
  const [f, ...rest] = S.posts;
  document.getElementById('featured').innerHTML = `<article class="feature-post rv">
    <a class="pcard" href="post.html?p=${f.slug}" aria-label="${esc(f.title)}"><img src="${img(f.img)}" alt=""></a>
    <div><div class="post-meta"><span class="chip blue">${esc(f.cat)}</span>${f.mins} min read</div>
    <h2><a href="post.html?p=${f.slug}">${esc(f.title)}</a></h2><p>${esc(f.excerpt)}</p>
    <a class="pill" href="post.html?p=${f.slug}" style="margin-top:20px"><span>Read the story</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M8 7h9v9"/></svg></i></a></div></article>`;

  const cats = ['All', ...new Set(rest.map(p => p.cat))];
  const catEl = document.getElementById('cats'), postsEl = document.getElementById('posts');
  catEl.innerHTML = cats.map((c, i) => `<button aria-pressed="${i === 0}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const show = c => { postsEl.innerHTML = rest.filter(p => c === 'All' || p.cat === c).map(R.post).join(''); reveal(); };
  catEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    catEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    show(b.dataset.c);
  });
  show('All');
})();
</script>
</body>
</html>
