<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us: Get a Free Bhutan Trip Plan | 555 Holidays</title>
<meta name="description" content="Get a free, no-obligation trip plan for Bhutan. WhatsApp +975 17300392, email info@bhutantourinfo.com, or visit us in Thimphu.">
<link rel="canonical" href="https://bhutantourinfo.com/contact.html">
<meta property="og:title" content="Contact 555 Holidays">
<meta property="og:image" content="https://bhutantourinfo.com/images/dest-paro.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<div class="page">
<header class="phero">
  <img src="images/dest-paro.jpg" alt="Rinpung Dzong in the Paro valley">
  <div data-nav></div>
  <div class="copy">
    <div class="crumb"><a href="index.html">Home</a><span>/</span><span>Contact</span></div>
    <h1>Let's plan your journey</h1>
    <p>A free, no-obligation trip plan, from our family in Thimphu to you.</p>
  </div>
</header>

<main id="main">
<section style="padding-top:clamp(50px,5vw,80px)">
  <div class="wrap">
    <div class="contact-grid">
      <form data-enquiry data-title="Get a free trip plan" class="rv"></form>
      <div class="ccards rv" id="ccards"></div>
    </div>
  </div>
</section>

<section id="offices" style="padding-top:clamp(60px,6vw,100px)" aria-labelledby="off-h">
  <div class="wrap">
    <div class="lead rv"><span class="label">Where to find us</span><h2 class="h2" id="off-h">Our offices</h2></div>
    <div class="offices" id="offices-grid"></div>
  </div>
</section>
</main>
<footer data-footer></footer>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const { C, I, R, waLink, reveal } = window.UI;
  document.getElementById('offices-grid').innerHTML = C.offices.map(R.office).join('');
  const map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(C.address);
  document.getElementById('ccards').innerHTML = [
    [waLink("Hello! I'd like a free trip plan for Bhutan."), I.wa, 'WhatsApp', C.phone + ' · usually the fastest way to reach us', true],
    ['mailto:' + C.email, I.mail, 'Email', C.email],
    ['tel:+97517300392', I.phone, 'Phone', C.phone],
    [map, I.pin, 'Visit us in Thimphu', C.address, true],
    [null, I.clock, 'Office hours', C.hours],
    [C.instagram, I.insta, 'Instagram', '@bhutantourinfo', true]
  ].map(([href, ic, t, s, ext]) => href
    ? `<a class="ccard" href="${href}"${ext ? ' target="_blank" rel="noopener"' : ''}><span class="ic">${ic}</span><span><b>${t}</b><span>${s}</span></span></a>`
    : `<div class="ccard"><span class="ic">${ic}</span><span><b>${t}</b><span>${s}</span></span></div>`).join('');
  reveal();
})();
</script>
</body>
</html>
