<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal | 555 Holidays</title>
<meta name="description" content="A story from the 555 Holidays journal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="blog">
<a class="skip" href="#main">Skip to content</a>
<div class="page">
<header class="phero">
  <img id="p-img" src="images/gal-2.jpg" alt="">
  <div data-nav></div>
  <div class="copy">
    <div class="crumb"><a href="index.html">Home</a><span>/</span><a href="blog.html">Journal</a><span>/</span><span id="p-cat"></span></div>
    <h1 id="p-title"></h1>
  </div>
</header>

<main id="main">
<section style="padding-top:clamp(40px,4vw,70px)">
  <div class="wrap">
    <article class="article rv">
      <div class="byline" id="p-by"></div>
      <div class="prose" id="p-body"></div>
      <div class="callout blue" style="margin-top:30px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        <div>Thinking about a trip? <a href="contact.html" style="text-decoration:underline">Get a free, no-obligation trip plan</a> from our team in Thimphu.</div></div>
    </article>
  </div>
</section>

<section style="padding-top:clamp(60px,6vw,100px)">
  <div class="wrap">
    <div class="lead with-link rv"><span class="label">Keep reading</span><h2 class="h2">More from the journal</h2><a class="see" href="blog.html">All stories →</a></div>
    <div class="posts" id="p-more"></div>
  </div>
</section>
</main>
<footer data-footer></footer>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const { S, R, esc, img, param, phHtml, reveal, I } = window.UI;
  const p = S.posts.find(x => x.slug === param('p')) || S.posts[0];
  document.title = `${p.title} | 555 Holidays Journal`;
  document.querySelector('meta[name=description]').content = p.excerpt;
  document.getElementById('p-img').src = img(p.img);
  document.getElementById('p-cat').textContent = p.cat;
  document.getElementById('p-title').textContent = p.title;
  document.getElementById('p-by').innerHTML = `<span class="chip blue">${esc(p.cat)}</span><span>By the 555 Holidays team, Thimphu</span><span>·</span><span>${p.mins} min read</span>`;
  document.getElementById('p-body').innerHTML = phHtml(p.body);
  document.getElementById('p-more').innerHTML = S.posts.filter(x => x.slug !== p.slug).slice(0, 3).map(R.post).join('');

  const ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'BlogPosting', headline: p.title, description: p.excerpt,
    image: `https://bhutantourinfo.com/images/${p.img}.jpg`, author: { '@type': 'Organization', name: '555 Holidays' },
    publisher: { '@type': 'Organization', name: '555 Holidays' } });
  document.head.appendChild(ld);
  reveal();
})();
</script>
</body>
</html>
